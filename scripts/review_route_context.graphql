query ReviewRouteContext(
  $owner: String!
  $repo: String!
  $number: Int!
  $headOid: GitObjectID!
) {
  repository(owner: $owner, name: $repo) {
    codexHeadObject: object(oid: $headOid) {
      __typename
      oid
      abbreviatedOid
    }
    pullRequest(number: $number) {
      number
      author {
        __typename
        login
        ... on User { databaseId }
        ... on Bot { databaseId }
      }
      body
      changedFiles
      createdAt
      headRefOid
      isDraft
      state
      updatedAt
      commits(last: 1) {
        nodes { commit { committedDate } }
      }
      timelineItems(last: 1, itemTypes: [HEAD_REF_FORCE_PUSHED_EVENT]) {
        nodes { ... on HeadRefForcePushedEvent { createdAt } }
      }
      reviews(last: 100) {
        totalCount
        nodes {
          author {
            __typename
            login
            ... on User { databaseId }
            ... on Bot { databaseId }
          }
          authorAssociation
          body
          commit { oid }
          lastEditedAt
          state
          submittedAt
        }
      }
      latestHumanOpinions: latestOpinionatedReviews(first: 100, writersOnly: true) {
        totalCount
        nodes {
          author {
            __typename
            login
            ... on User { databaseId }
            ... on Bot { databaseId }
          }
          authorAssociation
          commit { oid }
          state
          submittedAt
        }
      }
      comments(last: 100, orderBy: {field: UPDATED_AT, direction: ASC}) {
        totalCount
        nodes {
          id
          databaseId
          author {
            __typename
            login
            ... on User { databaseId }
            ... on Bot { databaseId }
          }
          authorAssociation
          body
          createdAt
          lastEditedAt
          updatedAt
        }
      }
      reviewThreads(first: 100) {
        totalCount
        nodes { isResolved }
      }
    }
    openPullRequests: pullRequests(first: 100, states: OPEN, baseRefName: "main") {
      totalCount
      nodes {
        headRefOid
        number
      }
    }
    recentPullRequests: pullRequests(
      first: 100
      orderBy: {field: UPDATED_AT, direction: DESC}
      states: [OPEN, MERGED, CLOSED]
    ) {
      totalCount
      nodes {
        updatedAt
        comments(last: 100, orderBy: {field: UPDATED_AT, direction: ASC}) {
          totalCount
          nodes {
            author {
              __typename
              ... on User { databaseId }
              ... on Bot { databaseId }
            }
            authorAssociation
            body
            createdAt
            lastEditedAt
            updatedAt
          }
        }
      }
    }
  }
}
