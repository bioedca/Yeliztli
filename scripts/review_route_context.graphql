query ReviewRouteContext(
  $owner: String!
  $repo: String!
  $number: Int!
  $headOid: GitObjectID!
  $includeCodeRabbitLedger: Boolean!
) {
  repository(owner: $owner, name: $repo) {
    codexHeadObject: object(oid: $headOid) {
      __typename
      oid
      abbreviatedOid
    }
    # Greptile's only clean artifact is a check run. It submits a formal review
    # solely when it has findings — a zero-comment Greptile review is its
    # "free trial has ended" notice — and it edits its summary comment in place,
    # so neither can carry a clean verdict. GitHub binds this check run to the
    # head commit itself, so the exact-head property is not self-reported.
    greptileHeadObject: object(oid: $headOid) {
      __typename
      ... on Commit {
        oid
        checkSuites(first: 20, filterBy: {appId: 867647}) {
          totalCount
          nodes {
            app {
              __typename
              databaseId
            }
            # `checkType` defaults to LATEST, which drops a superseded run on an
            # unchanged commit, and `totalCount` is computed after the filter, so
            # it agrees with the shortened page and the truncation guard below
            # proves nothing. ALL is what makes that guard real.
            checkRuns(first: 20, filterBy: {checkType: ALL}) {
              totalCount
              nodes {
                databaseId
                name
                status
                conclusion
                summary
                startedAt
                completedAt
              }
            }
          }
        }
      }
    }
    pullRequest(number: $number) {
      number
      author {
        __typename
        login
        ... on User { databaseId }
        ... on Bot { databaseId }
      }
      body
      changedFiles
      createdAt
      headRefOid
      isDraft
      state
      updatedAt
      commits(last: 1) {
        nodes { commit { committedDate } }
      }
      # Every Greptile run this pull request has spent, for the per-pull-request
      # budget. `last:` because the connection is ordered oldest-first, so
      # `first:` would omit the head on a long branch; `totalCount` against the
      # page length is what proves the view complete.
      greptileCommits: commits(last: 100) {
        totalCount
        nodes {
          commit {
            __typename
            oid
            checkSuites(first: 5, filterBy: {appId: 867647}) {
              totalCount
              nodes {
                app {
                  __typename
                  databaseId
                }
                checkRuns(first: 20, filterBy: {checkType: ALL}) {
                  totalCount
                  nodes {
                    databaseId
                    name
                    status
                    conclusion
                    summary
                    startedAt
                    completedAt
                  }
                }
              }
            }
          }
        }
      }
      timelineItems(last: 1, itemTypes: [HEAD_REF_FORCE_PUSHED_EVENT]) {
        nodes { ... on HeadRefForcePushedEvent { createdAt } }
      }
      reviews(last: 100) {
        totalCount
        nodes {
          id
          author {
            __typename
            login
            ... on User { databaseId }
            ... on Bot { databaseId }
          }
          authorAssociation
          body
          comments { totalCount }
          commit { oid }
          lastEditedAt
          state
          submittedAt
        }
      }
      latestHumanOpinions: latestOpinionatedReviews(first: 100, writersOnly: true) {
        totalCount
        nodes {
          author {
            __typename
            login
            ... on User { databaseId }
            ... on Bot { databaseId }
          }
          authorAssociation
          commit { oid }
          state
          submittedAt
        }
      }
      comments(last: 100, orderBy: {field: UPDATED_AT, direction: ASC}) {
        totalCount
        nodes {
          id
          databaseId
          author {
            __typename
            login
            ... on User { databaseId }
            ... on Bot { databaseId }
          }
          authorAssociation
          body
          createdAt
          lastEditedAt
          updatedAt
        }
      }
      reviewThreads(first: 100) {
        totalCount
        nodes { isResolved }
      }
    }
    openPullRequests: pullRequests(first: 100, states: OPEN, baseRefName: "main") {
      totalCount
      nodes {
        headRefOid
        number
      }
    }
    recentPullRequests: pullRequests(
      first: 100
      orderBy: {field: UPDATED_AT, direction: DESC}
      states: [OPEN, MERGED, CLOSED]
    ) @include(if: $includeCodeRabbitLedger) {
      totalCount
      nodes {
        updatedAt
        comments(last: 100, orderBy: {field: UPDATED_AT, direction: ASC}) {
          totalCount
          nodes {
            author {
              __typename
              ... on User { databaseId }
              ... on Bot { databaseId }
            }
            authorAssociation
            body
            createdAt
            lastEditedAt
            updatedAt
          }
        }
      }
    }
  }
}
