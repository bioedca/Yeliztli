name: Source bundle durability

on:
  pull_request:
    paths:
      - backend/annotation/mondo_hpo.py
      - tests/backend/test_mondo_hpo.py
      - pyproject.toml
      - .github/workflows/source-bundle-durability.yml
  push:
    branches: [main]
    paths:
      - backend/annotation/mondo_hpo.py
      - tests/backend/test_mondo_hpo.py
      - pyproject.toml
      - .github/workflows/source-bundle-durability.yml

permissions:
  contents: read

jobs:
  durability:
    name: Source durability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify publication ordering and fail-closed recovery
        run: python -m pytest tests/backend/test_mondo_hpo.py -v --tb=short
