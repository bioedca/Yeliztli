# TEMPORARY — regenerate the cross-browser visual baselines after the TopNav
# logo change, in the SAME environment as the ci.yml `test-e2e` job so the new
# baselines match what CI will compare against. Push-triggered on this branch.
# Deleted before the PR is opened; never lands on main.
name: Regenerate visual baselines

on:
  push:
    branches: [topnav-logo]

permissions:
  contents: read

jobs:
  regen:
    name: Regenerate — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Python deps
        run: pip install -e ".[dev]"

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Install root E2E deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Regenerate visual snapshots (${{ matrix.browser }})
        run: npx playwright test cross-browser.spec.ts -g "capture" --project=${{ matrix.browser }} --update-snapshots
        env:
          CI: true
          YELIZTLI_HUEY_IMMEDIATE: "true"

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@v7
        with:
          name: baselines-${{ matrix.browser }}
          path: tests/e2e/cross-browser.spec.ts-snapshots/*-${{ matrix.browser }}-linux.png
          retention-days: 1
