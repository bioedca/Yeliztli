[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yeliztli"
version = "0.2.0"
description = "Personal genomics analysis platform for 23andMe and AncestryDNA raw data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "bioedca", email = "bioedca@gmail.com" },
]

dependencies = [
    "fastapi",
    "starlette",
    "python-multipart",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "huey",
    "httpx",
    "structlog",
    "bcrypt",
    "packaging",
    "pyliftover",
    "biopython",
    "numpy",
    "scipy",
    "plotly",
    "jinja2>=3.0",
    "playwright>=1.40",
    "pysam>=0.22",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    # Pinned: ruff's formatter output can change across releases; an exact pin
    # keeps `ruff format --check` deterministic between local and CI (bump
    # intentionally + reformat the tree in the same PR).
    "ruff==0.15.15",
    "mypy",
    "pyyaml",
    "pandas",
    # Dead-code detector (#579). Pinned: vulture's findings/confidence can shift
    # across releases, so an exact pin keeps the CI advisory deterministic.
    "vulture==2.16",
]
# Documentation site (MkDocs Material). Install with `pip install -e ".[docs]"`
# — used locally, by the `docs-build` CI job, and by the Pages deploy workflow.
docs = [
    "mkdocs-material",
    "pymdown-extensions",
]

[project.scripts]
yeliztli-setup = "backend.installer:main"

[project.urls]
Homepage = "https://github.com/bioedca/Yeliztli"
Repository = "https://github.com/bioedca/Yeliztli"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# Dead-code detector (#579) — the Python sibling of the frontend `knip` advisory
# (#555). ruff (E/F/I/UP) flags unused *locals* and *imports* but NOT unused
# module-level constants/functions, so dead code ships CI-invisible (the recurring
# #527/#535/#553/#561 cleanup cluster). Vulture fills that gap.
#
# Run in CI advisory-only (`continue-on-error`) — see `.github/workflows/ci.yml`
# and `whitelist_vulture.py`. `min_confidence = 60` is needed to surface unused
# module-level functions/constants (vulture rates those 60%); the framework
# dynamic-reference false positives that confidence surfaces (Pydantic model
# fields, SQLAlchemy declarative attrs / event-listener params, FastAPI/Huey
# decorated callables, pydantic-settings source hooks) are suppressed by the
# decorator list below plus the reviewed `whitelist_vulture.py` baseline.
#
# Known limitation: vulture ignores `_`-prefixed (private) names by convention,
# so a private dead constant like #527's `_TSV_COLUMN_MAP` is NOT caught — vulture
# covers the *public* dead-symbol class (#535/#553/#561), not the private one.
[tool.vulture]
# Scan backend AND tests together so a backend symbol referenced only from a test
# is not false-flagged as dead (and genuinely-dead backend code is still caught);
# whitelist_vulture.py is the reviewed baseline of current framework dynamic-refs.
paths = ["backend", "tests", "whitelist_vulture.py"]
min_confidence = 60
ignore_decorators = [
    "@router.*",
    "@app.*",
    "@*.get",
    "@*.post",
    "@*.put",
    "@*.patch",
    "@*.delete",
    "@*.websocket",
    "@*.task",
    "@*.periodic_task",
    "@huey.*",
    "@pytest.*",
    "@field_validator",
    "@model_validator",
    "@validator",
    "@root_validator",
    "@*.command",
    "@*.callback",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: marks end-to-end tests",
    "integration: marks integration tests",
    "requires_java: marks tests that need a real Java runtime (skipped when unavailable)",
    "requires_real_bundle: marks tests that need the real production LAI/VEP bundle on disk (skipped when absent; consumed by the nightly slow-tier workflow)",
]
