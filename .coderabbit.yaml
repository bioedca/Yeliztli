# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration. Scope: review triggering plus advisory review
# guidance — CodeRabbit uses its defaults for everything not set here.
reviews:
  # Hosted CodeRabbit review is opt-in (#2247).
  #
  # CodeRabbit's included reviews are one adaptive per-developer pool shared by
  # this GitHub App and the local `coderabbit` CLI. Leaving auto-review at its
  # defaults made every PR open and every push a review trigger: over the first
  # 13 active days of Review Route v3 that was 42 opens plus 333 pushes, and
  # none of the 57 hosted reviews it produced landed on a pull request whose
  # `## Review route` section had selected CodeRabbit. Both pull requests that
  # did select CodeRabbit were then refused under the Fair Usage Limits Policy.
  #
  # So: no review on open, none on push, none on drafts. A reviewer arrives
  # when a maintainer or owning agent applies the `review:coderabbit` label, or
  # asks for one with an explicit `@coderabbitai review` comment. That keeps the
  # budget available for the lane the route actually selected, and it matches
  # the repository rule that an unselected hosted lane is never triggered.
  auto_review:
    enabled: false
    auto_incremental_review: false
    drafts: false
    labels:
      - "review:coderabbit"
  path_instructions:
    - path: "tests/**"
      instructions: |
        Enforce the repo's "Test assertion standards" (see CONTRIBUTING.md) as
        ADVISORY review comments.

        Flag a NEW or MODIFIED test whose ONLY assertion on a value-producing
        call is `assert x is not None`, or whose only assertion on a
        data-returning endpoint is `assert response.status_code == 200` (or a
        similar status-only check). These pass for almost any non-crashing
        behavior and hide regressions — ask for an assertion on the actual
        value, rendered output, returned set, or row count.

        Do NOT flag tests that assert the status AND then assert the body, or
        where `is not None` is a precondition followed by value assertions, or
        where the status code itself is the behavior under test (e.g. a 401/404
        guard test).

        Also flag a `for item in items: assert ...` loop that is not guarded by
        a non-empty check (`assert items`), since it passes vacuously on an
        empty list.

        For an analysis module that emits clinical findings whose presence
        depends on the person CARRYING a variant, check that the change includes
        (or the module already has) a hom_ref / non-carrier negative control —
        a test seeding a non-carrier Pathogenic variant (or all-reference
        genotype) and asserting it is absent from findings. See
        tests/backend/_carriage_fixtures.py.
